services:
  hotel-db:
    image: postgres:16-alpine
    container_name: hotel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: siu_hotel
      POSTGRES_USER: siu_hotel
      POSTGRES_PASSWORD: siu_hotel_password_change_me
    volumes:
      - hotel-db-data:/var/lib/postgresql/data
    networks:
      - hotel_internal

  hotel-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-frontend
    restart: unless-stopped
    depends_on:
      - hotel-db
    environment:
      NODE_ENV: production
      PORT: "3000"
      JWT_SECRET: change-me-to-a-long-random-string
      DATABASE_URL: postgresql://siu_hotel:siu_hotel_password_change_me@hotel-db:5432/siu_hotel?schema=public
      # Server-side fetches to this container’s `/api/*` (same process as Next)
      INTERNAL_APP_URL: http://127.0.0.1:3000
    ports:
      - "3000:3000"
    networks:
      - hotel_internal
      - banklab_default

volumes:
  hotel-db-data:

networks:
  hotel_internal:
    driver: bridge
  banklab_default:
    external: true
